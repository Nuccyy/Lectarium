<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lectarium — Carnet de lecture savant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F7F5F0;
  --bg2: #EFECE5;
  --bg3: #E5E1D8;
  --paper: #FDFCFA;
  --ink: #1C1A17;
  --ink2: #4A4740;
  --ink3: #8A8780;
  --border: rgba(60,55,45,0.12);
  --border2: rgba(60,55,45,0.22);
  --accent: #6B4F2A;
  --accent-bg: #F5EDE0;
  --accent-light: #EDD9BE;
  --gold: #B8892A;
  --gold-bg: #FDF6E8;
  --blue: #2B5278;
  --blue-bg: #EAF0F8;
  --green: #2D6640;
  --green-bg: #E8F2EB;
  --red: #8B3325;
  --red-bg: #F5E8E6;
  --serif: 'Source Serif 4', Georgia, serif;
  --display: 'Playfair Display', Georgia, serif;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg: 0 2px 8px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
  --r: 6px;
  --rl: 10px;
  --rxl: 14px;
}

[data-theme="dark"] {
  --bg: #141210;
  --bg2: #1C1A16;
  --bg3: #242018;
  --paper: #1E1C18;
  --ink: #F0EDE6;
  --ink2: #B8B4AA;
  --ink3: #6A6760;
  --border: rgba(255,245,220,0.10);
  --border2: rgba(255,245,220,0.18);
  --accent: #C8926A;
  --accent-bg: #2A2018;
  --accent-light: #342818;
  --gold: #D4A855;
  --gold-bg: #241E10;
  --blue: #7AABDA;
  --blue-bg: #101C28;
  --green: #6DBF85;
  --green-bg: #101A12;
  --red: #D47A6A;
  --red-bg: #221410;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
  --shadow-lg: 0 2px 8px rgba(0,0,0,0.4), 0 8px 32px rgba(0,0,0,0.3);
}

html, body { height: 100%; }
body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--ink);
  transition: background 0.3s, color 0.3s;
  overflow: hidden;
}

/* ─── LAYOUT ─── */
.app { display: flex; height: 100vh; }

/* ─── SIDEBAR ─── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s;
}

.sidebar-brand {
  padding: 22px 18px 16px;
  border-bottom: 1px solid var(--border);
}

.brand-name {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.5px;
  line-height: 1;
}

.brand-sub {
  font-size: 11px;
  color: var(--ink3);
  font-style: italic;
  margin-top: 3px;
  letter-spacing: 0.3px;
}

.sidebar-section {
  padding: 12px 10px 4px;
}

.section-label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink3);
  padding: 0 8px;
  margin-bottom: 3px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: var(--r);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--serif);
  color: var(--ink2);
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s, color 0.15s;
}

.nav-btn:hover { background: var(--border); color: var(--ink); }
.nav-btn.active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }

.nav-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.works-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
}

.works-scroll::-webkit-scrollbar { width: 4px; }
.works-scroll::-webkit-scrollbar-track { background: transparent; }
.works-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.work-btn {
  display: block;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--r);
  cursor: pointer;
  background: none;
  border: none;
  text-align: left;
  margin-bottom: 2px;
  transition: background 0.15s;
}

.work-btn:hover { background: var(--paper); }
.work-btn.active { background: var(--paper); box-shadow: var(--shadow); }

.work-title-text {
  font-size: 12.5px;
  color: var(--ink);
  font-family: var(--serif);
  font-weight: 400;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}

.work-author-text {
  font-size: 11px;
  color: var(--ink3);
  font-style: italic;
  display: block;
  margin-top: 1px;
}

.work-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
}

.mini-bar {
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.mini-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 1px;
  transition: width 0.4s;
}

.work-stat-text {
  font-size: 10px;
  color: var(--ink3);
  white-space: nowrap;
}

.sidebar-footer {
  padding: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}

.btn-add-work {
  flex: 1;
  padding: 8px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink2);
  font-size: 12px;
  font-family: var(--serif);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-add-work:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-light); }

.btn-icon-round {
  width: 34px;
  height: 34px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink2);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.btn-icon-round:hover { background: var(--bg3); color: var(--ink); }

/* ─── MAIN ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  flex: 1;
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-wrap svg {
  position: absolute;
  left: 9px;
  width: 13px;
  height: 13px;
  color: var(--ink3);
  pointer-events: none;
}

.search-field {
  padding: 6px 10px 6px 28px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 12px;
  width: 200px;
  transition: border-color 0.15s, width 0.2s;
}

.search-field:focus { outline: none; border-color: var(--border2); width: 240px; }
.search-field::placeholder { color: var(--ink3); font-style: italic; }

.btn-flat {
  padding: 6px 12px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 12px;
  font-family: var(--serif);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn-flat:hover { border-color: var(--border2); color: var(--ink); background: var(--bg2); }

/* ─── CONTENT AREA ─── */
.content-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── NOTES ZONE ─── */
.notes-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.tabs-bar {
  display: flex;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

.tab-btn {
  padding: 10px 16px;
  font-size: 12.5px;
  font-family: var(--serif);
  color: var(--ink3);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}

.tab-btn:hover { color: var(--ink2); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }

.tab-panel { display: none; flex: 1; overflow-y: auto; padding: 20px; }
.tab-panel.active { display: block; }

.tab-panel::-webkit-scrollbar { width: 5px; }
.tab-panel::-webkit-scrollbar-track { background: transparent; }
.tab-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ─── NOTES ─── */
.note-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--rl);
  padding: 14px 16px;
  margin-bottom: 10px;
  position: relative;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow);
}

.note-card:hover { border-color: var(--border2); box-shadow: var(--shadow-lg); }

.note-card.highlight { border-left: 3px solid var(--gold); }
.note-card.insight   { border-left: 3px solid var(--blue); }
.note-card.question  { border-left: 3px solid var(--red); }
.note-card.summary   { border-left: 3px solid var(--green); }
.note-card.lexicon   { border-left: 3px solid var(--accent); }

.note-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.type-pill {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-family: var(--serif);
  letter-spacing: 0.3px;
  font-weight: 400;
}

.pill-highlight { background: var(--gold-bg); color: var(--gold); }
.pill-insight   { background: var(--blue-bg); color: var(--blue); }
.pill-question  { background: var(--red-bg); color: var(--red); }
.pill-summary   { background: var(--green-bg); color: var(--green); }
.pill-lexicon   { background: var(--accent-bg); color: var(--accent); }

.page-pill {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--bg2);
  color: var(--ink3);
  border: 1px solid var(--border);
}

.work-pill {
  font-size: 10px;
  color: var(--ink3);
  font-style: italic;
  margin-left: auto;
}

.note-quote {
  font-style: italic;
  color: var(--ink2);
  font-size: 13.5px;
  border-left: 2px solid var(--accent-light);
  padding: 4px 12px;
  margin-bottom: 8px;
  line-height: 1.6;
}

.note-text {
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.7;
  font-family: var(--serif);
}

.note-actions {
  position: absolute;
  top: 10px;
  right: 12px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
}

.note-card:hover .note-actions { opacity: 1; }

.btn-note-act {
  padding: 3px 8px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--ink3);
  font-size: 11px;
  cursor: pointer;
  font-family: var(--serif);
  transition: all 0.15s;
}

.btn-note-act:hover { background: var(--bg3); color: var(--ink); border-color: var(--border2); }
.btn-note-act.del:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }

/* ─── INPUT ZONE ─── */
.input-zone {
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  background: var(--bg);
  flex-shrink: 0;
}

.type-selector {
  display: flex;
  gap: 5px;
  margin-bottom: 9px;
  flex-wrap: wrap;
}

.type-toggle {
  padding: 4px 11px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 11.5px;
  font-family: var(--serif);
  color: var(--ink3);
  cursor: pointer;
  transition: all 0.15s;
}

.type-toggle:hover { border-color: var(--border2); color: var(--ink2); }
.type-toggle.active { color: var(--ink); border-color: var(--border2); background: var(--paper); box-shadow: var(--shadow); }

.quote-field {
  width: 100%;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: transparent;
  color: var(--ink2);
  font-family: var(--serif);
  font-size: 13px;
  font-style: italic;
  margin-bottom: 7px;
  transition: border-color 0.15s;
}

.quote-field:focus { outline: none; border-color: var(--border2); }
.quote-field::placeholder { color: var(--ink3); }

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.note-field {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 13.5px;
  resize: none;
  min-height: 64px;
  line-height: 1.6;
  transition: border-color 0.15s;
}

.note-field:focus { outline: none; border-color: var(--border2); }
.note-field::placeholder { color: var(--ink3); font-style: italic; }

.btn-primary {
  padding: 9px 18px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  font-family: var(--serif);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.btn-primary:hover { background: var(--ink); color: var(--bg); }

.input-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 7px;
}

.page-field {
  width: 80px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: transparent;
  color: var(--ink2);
  font-size: 12px;
  font-family: var(--serif);
  transition: border-color 0.15s;
}

.page-field:focus { outline: none; border-color: var(--border2); }
.page-field::placeholder { color: var(--ink3); }

.context-label {
  font-size: 11.5px;
  color: var(--ink3);
  font-style: italic;
}

.context-label strong { font-style: normal; color: var(--ink2); font-weight: 400; }

/* ─── AI PANEL ─── */
.ai-panel {
  width: 280px;
  min-width: 280px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  overflow: hidden;
}

.ai-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.ai-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.ai-head-title {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.ai-api-key-area {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.api-key-label {
  font-size: 10px;
  color: var(--ink3);
  display: block;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.api-key-row {
  display: flex;
  gap: 5px;
}

.api-key-input {
  flex: 1;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
  font-family: var(--serif);
  transition: border-color 0.15s;
}

.api-key-input:focus { outline: none; border-color: var(--border2); }
.api-key-input::placeholder { color: var(--ink3); }

.btn-key-save {
  padding: 5px 10px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink2);
  font-size: 11px;
  font-family: var(--serif);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-key-save:hover { background: var(--ink); color: var(--bg); }

.ai-btns {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.btn-ai-action {
  padding: 8px 12px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 12.5px;
  font-family: var(--serif);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: all 0.15s;
  box-shadow: var(--shadow);
}

.btn-ai-action:hover { background: var(--bg3); border-color: var(--border2); color: var(--ink); }

.ai-btn-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.ai-output-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}

.ai-output-wrap::-webkit-scrollbar { width: 4px; }
.ai-output-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ai-thinking-msg {
  text-align: center;
  padding: 20px;
  color: var(--ink3);
  font-size: 12px;
  font-style: italic;
  display: none;
}

.ai-result-title {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.ai-result-body {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.75;
  font-family: var(--serif);
}

.ai-placeholder {
  text-align: center;
  padding: 24px 12px;
  color: var(--ink3);
  font-size: 12.5px;
  font-style: italic;
  line-height: 1.7;
  font-family: var(--serif);
}

/* ─── FICHE ─── */
.fiche-wrap {
  max-width: 680px;
}

.fiche-title {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
  font-style: italic;
}

.fiche-author {
  font-size: 14px;
  color: var(--ink3);
  margin-bottom: 20px;
  font-style: italic;
}

.fiche-section {
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.fiche-section:last-child { border-bottom: none; }

.fiche-label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink3);
  margin-bottom: 10px;
}

.fiche-item {
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.7;
  margin-bottom: 8px;
  font-family: var(--serif);
  display: flex;
  gap: 8px;
}

.fiche-bullet {
  color: var(--ink3);
  flex-shrink: 0;
  margin-top: 2px;
}

.fiche-quote {
  font-style: italic;
  color: var(--ink2);
  font-size: 13px;
  border-left: 2px solid var(--accent-light);
  padding: 4px 12px;
  margin-bottom: 8px;
  line-height: 1.65;
}

/* ─── STATS ─── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.stat-box {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--rl);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.stat-num {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}

.stat-lbl {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 4px;
}

.progress-section {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--rl);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.prog-title {
  font-size: 13px;
  color: var(--ink);
  font-family: var(--serif);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.prog-bar-wrap {
  height: 5px;
  background: var(--bg2);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}

.prog-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width 0.5s ease;
}

.prog-update {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
}

.prog-input {
  width: 80px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg2);
  color: var(--ink);
  font-size: 12px;
  font-family: var(--serif);
}

.prog-input:focus { outline: none; border-color: var(--border2); }

.btn-prog { padding: 4px 10px; border-radius: var(--r); border: 1px solid var(--border); background: var(--bg); color: var(--ink2); font-size: 11px; font-family: var(--serif); cursor: pointer; }
.btn-prog:hover { background: var(--bg3); }

.bar-chart-section {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--rl);
  padding: 16px;
  box-shadow: var(--shadow);
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.bar-label {
  font-size: 12px;
  color: var(--ink2);
  width: 90px;
  flex-shrink: 0;
}

.bar-track {
  flex: 1;
  height: 6px;
  background: var(--bg2);
  border-radius: 3px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

.bar-count {
  font-size: 12px;
  color: var(--ink3);
  width: 24px;
  text-align: right;
}

/* ─── MODAL ─── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.modal-bg.open { opacity: 1; pointer-events: all; }

.modal-box {
  background: var(--paper);
  border-radius: var(--rxl);
  border: 1px solid var(--border2);
  padding: 24px;
  width: 380px;
  max-width: 95vw;
  box-shadow: var(--shadow-lg);
  transform: translateY(12px);
  transition: transform 0.2s;
}

.modal-bg.open .modal-box { transform: translateY(0); }

.modal-title {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 18px;
}

.form-group {
  margin-bottom: 12px;
}

.form-lbl {
  font-size: 11px;
  color: var(--ink3);
  display: block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

.form-inp {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg2);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 13.5px;
  transition: border-color 0.15s;
}

.form-inp:focus { outline: none; border-color: var(--border2); }

.modal-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

/* ─── EMPTY ─── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink3);
}

.empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.empty-text {
  font-size: 14px;
  font-style: italic;
  font-family: var(--serif);
  line-height: 1.7;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: var(--r);
  font-size: 13px;
  font-family: var(--serif);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 300;
}

.toast.show { opacity: 1; }

/* ─── EXPORT BTN ─── */
.btn-export {
  padding: 6px 12px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 12px;
  font-family: var(--serif);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-export:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-light); }

</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">Lectarium</div>
      <div class="brand-sub">carnet de lecture savant</div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Vues</div>
      <button class="nav-btn active" id="nav-all" onclick="setView('all')">
        <span class="nav-icon">◈</span> Toutes les notes
      </button>
      <button class="nav-btn" id="nav-highlight" onclick="setView('highlight')">
        <span class="nav-icon">◐</span> Surlignages
      </button>
      <button class="nav-btn" id="nav-insight" onclick="setView('insight')">
        <span class="nav-icon">◆</span> Idées clés
      </button>
      <button class="nav-btn" id="nav-question" onclick="setView('question')">
        <span class="nav-icon">◌</span> Questions
      </button>
      <button class="nav-btn" id="nav-lexicon" onclick="setView('lexicon')">
        <span class="nav-icon">α</span> Lexique
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Bibliothèque</div>
    </div>

    <div class="works-scroll" id="works-list"></div>

    <div class="sidebar-footer">
      <button class="btn-add-work" onclick="openModal()">+ Nouvelle œuvre</button>
      <button class="btn-icon-round" onclick="toggleTheme()" title="Mode sombre/clair">◑</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Toutes les notes</div>
      <div class="search-wrap">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3a6 6 0 100 12A6 6 0 009 3zM1 9a8 8 0 1114.32 4.906l3.387 3.387a1 1 0 01-1.414 1.414l-3.387-3.387A8 8 0 011 9z" clip-rule="evenodd"/></svg>
        <input class="search-field" id="search" placeholder="Chercher dans les notes…" oninput="renderNotes()">
      </div>
      <button class="btn-flat" id="sort-btn" onclick="toggleSort()">Date ↓</button>
      <button class="btn-export" onclick="exportNotes()">⇣ Exporter</button>
    </div>

    <div class="content-wrap">
      <div class="notes-zone">

        <div class="tabs-bar">
          <button class="tab-btn active" id="tab-notes" onclick="setTab('notes')">Notes</button>
          <button class="tab-btn" id="tab-fiche" onclick="setTab('fiche')">Fiche</button>
          <button class="tab-btn" id="tab-stats" onclick="setTab('stats')">Avancement</button>
        </div>

        <!-- NOTES TAB -->
        <div class="tab-panel active" id="panel-notes">
          <div id="notes-list"></div>
        </div>

        <!-- FICHE TAB -->
        <div class="tab-panel" id="panel-fiche">
          <div class="fiche-wrap" id="fiche-content"></div>
        </div>

        <!-- STATS TAB -->
        <div class="tab-panel" id="panel-stats">
          <div id="stats-content"></div>
        </div>

        <!-- INPUT ZONE -->
        <div class="input-zone">
          <div class="type-selector">
            <button class="type-toggle active" id="type-highlight" onclick="setType('highlight')">◐ Surlignage</button>
            <button class="type-toggle" id="type-insight" onclick="setType('insight')">◆ Idée clé</button>
            <button class="type-toggle" id="type-question" onclick="setType('question')">◌ Question</button>
            <button class="type-toggle" id="type-summary" onclick="setType('summary')">≡ Résumé</button>
            <button class="type-toggle" id="type-lexicon" onclick="setType('lexicon')">α Lexique</button>
          </div>
          <input class="quote-field" id="quote-field" placeholder="Citation exacte du texte (optionnel)…">
          <div class="input-row">
            <textarea class="note-field" id="note-field" placeholder="Votre note, réflexion, définition, analyse…" rows="2"></textarea>
            <button class="btn-primary" onclick="saveNote()">Sauver →</button>
          </div>
          <div class="input-meta">
            <input class="page-field" id="page-field" placeholder="p. 42">
            <span class="context-label">
              Œuvre : <strong id="work-ctx">Aucune sélectionnée</strong>
            </span>
          </div>
        </div>
      </div>

      <!-- AI PANEL -->
      <div class="ai-panel">
        <div class="ai-head">
          <div class="ai-status-dot" id="ai-dot"></div>
          <div class="ai-head-title">Assistant IA</div>
        </div>

        <div class="ai-api-key-area">
          <label class="api-key-label">Clé API Anthropic</label>
          <div class="api-key-row">
            <input class="api-key-input" id="api-key-input" type="password" placeholder="sk-ant-…">
            <button class="btn-key-save" onclick="saveApiKey()">OK</button>
          </div>
        </div>

        <div class="ai-btns">
          <button class="btn-ai-action" onclick="aiAction('résumé')">
            <span class="ai-btn-icon">≡</span> Résumer mes notes
          </button>
          <button class="btn-ai-action" onclick="aiAction('thèmes')">
            <span class="ai-btn-icon">◈</span> Dégager les thèmes
          </button>
          <button class="btn-ai-action" onclick="aiAction('questions')">
            <span class="ai-btn-icon">◌</span> Approfondir les questions
          </button>
          <button class="btn-ai-action" onclick="aiAction('fiche')">
            <span class="ai-btn-icon">□</span> Fiche de lecture IA
          </button>
          <button class="btn-ai-action" onclick="aiAction('critique')">
            <span class="ai-btn-icon">◆</span> Analyse critique
          </button>
          <button class="btn-ai-action" onclick="aiAction('lexique')">
            <span class="ai-btn-icon">α</span> Enrichir le lexique
          </button>
        </div>

        <div class="ai-output-wrap">
          <div class="ai-thinking-msg" id="ai-thinking">Réflexion en cours…</div>
          <div id="ai-result">
            <div class="ai-placeholder">
              Entrez votre clé API Anthropic ci-dessus,<br>puis sélectionnez une action pour analyser vos notes.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NOUVELLE ŒUVRE -->
<div class="modal-bg" id="modal-bg" onclick="handleModalBgClick(event)">
  <div class="modal-box">
    <div class="modal-title">Nouvelle œuvre</div>
    <div class="form-group">
      <label class="form-lbl">Titre</label>
      <input class="form-inp" id="f-title" placeholder="Ex : Éloges du Dépassement">
    </div>
    <div class="form-group">
      <label class="form-lbl">Auteur(s)</label>
      <input class="form-inp" id="f-author" placeholder="Ex : Thomas Pesquet, Étienne Klein">
    </div>
    <div class="form-group">
      <label class="form-lbl">Catégorie</label>
      <input class="form-inp" id="f-cat" placeholder="Ex : Essai, Roman, Article, Philosophie…">
    </div>
    <div class="form-group">
      <label class="form-lbl">Nombre de pages</label>
      <input class="form-inp" id="f-pages" type="number" placeholder="Ex : 280">
    </div>
    <div class="form-group">
      <label class="form-lbl">Année de publication</label>
      <input class="form-inp" id="f-year" type="number" placeholder="Ex : 2023">
    </div>
    <div class="modal-footer">
      <button class="btn-flat" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="addWork()">Créer →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let works = [], notes = [], currentWorkId = null, currentView = 'all', currentType = 'highlight', currentTab = 'notes', sortAsc = false, apiKey = '';

// ── STORAGE ──
function save() {
  localStorage.setItem('lectarium_works', JSON.stringify(works));
  localStorage.setItem('lectarium_notes', JSON.stringify(notes));
}

function load() {
  try { works = JSON.parse(localStorage.getItem('lectarium_works') || '[]'); } catch(e){ works=[]; }
  try { notes = JSON.parse(localStorage.getItem('lectarium_notes') || '[]'); } catch(e){ notes=[]; }
  apiKey = localStorage.getItem('lectarium_api_key') || '';
  if(apiKey) document.getElementById('api-key-input').value = apiKey;
  const theme = localStorage.getItem('lectarium_theme') || 'light';
  if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
}

function saveApiKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  localStorage.setItem('lectarium_api_key', apiKey);
  toast('Clé API sauvegardée');
}

// ── THEME ──
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('lectarium_theme', isDark ? 'light' : 'dark');
}

// ── WORKS ──
function renderWorks() {
  const list = document.getElementById('works-list');
  list.innerHTML = '';
  if(!works.length) {
    list.innerHTML = '<div style="padding:12px 10px; font-size:12px; color:var(--ink3); font-style:italic; text-align:center; line-height:1.6;">Commencez par ajouter une œuvre à votre bibliothèque.</div>';
  }
  works.forEach(w => {
    const cnt = notes.filter(n=>n.workId===w.id).length;
    const pct = w.pages ? Math.min(100, Math.round((w.read||0)/w.pages*100)) : 0;
    const btn = document.createElement('button');
    btn.className = 'work-btn' + (currentWorkId===w.id ? ' active' : '');
    btn.innerHTML = `
      <span class="work-title-text">${w.title}</span>
      <span class="work-author-text">${w.author}</span>
      <div class="work-meta-row">
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
        <span class="work-stat-text">${cnt} note${cnt!==1?'s':''}</span>
      </div>`;
    btn.onclick = () => selectWork(w.id);
    list.appendChild(btn);
  });
  const ctx = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  document.getElementById('work-ctx').textContent = ctx ? ctx.title : 'Aucune sélectionnée';
}

function selectWork(id) {
  currentWorkId = (currentWorkId === id) ? null : id;
  const w = works.find(w=>w.id===currentWorkId);
  document.getElementById('topbar-title').textContent = w ? `${w.title} — ${w.author}` : 'Toutes les notes';
  renderWorks(); renderNotes(); renderFiche(); renderStats();
}

// ── MODAL ──
function openModal() {
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

function handleModalBgClick(e) {
  if(e.target === document.getElementById('modal-bg')) closeModal();
}

function addWork() {
  const title = document.getElementById('f-title').value.trim();
  const author = document.getElementById('f-author').value.trim();
  if(!title||!author) { toast('Titre et auteur requis'); return; }
  const w = {
    id: Date.now(),
    title, author,
    cat: document.getElementById('f-cat').value.trim() || 'Non classé',
    pages: parseInt(document.getElementById('f-pages').value)||0,
    year: document.getElementById('f-year').value.trim(),
    read: 0
  };
  works.push(w);
  save();
  ['f-title','f-author','f-cat','f-pages','f-year'].forEach(id=>{ document.getElementById(id).value=''; });
  closeModal();
  currentWorkId = w.id;
  document.getElementById('topbar-title').textContent = `${w.title} — ${w.author}`;
  renderWorks(); renderNotes(); renderFiche(); renderStats();
  toast(`"${w.title}" ajouté`);
}

// ── VIEW / TAB / TYPE ──
function setView(v) {
  currentView = v;
  ['all','highlight','insight','question','lexicon'].forEach(id => {
    document.getElementById('nav-'+id)?.classList.remove('active');
  });
  document.getElementById('nav-'+v)?.classList.add('active');
  renderNotes();
}

function setTab(t) {
  currentTab = t;
  ['notes','fiche','stats'].forEach(id => {
    document.getElementById('tab-'+id).classList.remove('active');
    document.getElementById('panel-'+id).classList.remove('active');
  });
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('panel-'+t).classList.add('active');
  if(t==='fiche') renderFiche();
  if(t==='stats') renderStats();
}

function setType(t) {
  currentType = t;
  ['highlight','insight','question','summary','lexicon'].forEach(id => {
    document.getElementById('type-'+id)?.classList.remove('active');
  });
  document.getElementById('type-'+t)?.classList.add('active');
}

function toggleSort() {
  sortAsc = !sortAsc;
  document.getElementById('sort-btn').textContent = sortAsc ? 'Date ↑' : 'Date ↓';
  renderNotes();
}

// ── NOTES ──
const TYPE_LABELS = { highlight:'Surlignage', insight:'Idée clé', question:'Question', summary:'Résumé', lexicon:'Lexique' };

function renderNotes() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = notes.filter(n => {
    if(currentWorkId && n.workId !== currentWorkId) return false;
    if(currentView !== 'all' && n.type !== currentView) return false;
    if(q && !n.text.toLowerCase().includes(q) && !(n.quote||'').toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a,b) => sortAsc ? a.date-b.date : b.date-a.date);

  const list = document.getElementById('notes-list');
  if(!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-text">Aucune note ici pour l'instant.<br>Commencez à lire et prenez vos premières notes.</div></div>`;
    return;
  }
  list.innerHTML = '';
  filtered.forEach(n => {
    const w = works.find(w=>w.id===n.workId);
    const div = document.createElement('div');
    div.className = `note-card ${n.type}`;
    div.innerHTML = `
      <div class="note-actions">
        <button class="btn-note-act del" onclick="deleteNote(${n.id})">Supprimer</button>
      </div>
      <div class="note-header">
        <span class="type-pill pill-${n.type}">${TYPE_LABELS[n.type]||n.type}</span>
        ${n.page ? `<span class="page-pill">p.&nbsp;${n.page}</span>` : ''}
        ${w ? `<span class="work-pill">${w.author}, <em>${w.title}</em></span>` : ''}
      </div>
      ${n.quote ? `<div class="note-quote">"${escHtml(n.quote)}"</div>` : ''}
      <div class="note-text">${escHtml(n.text)}</div>
    `;
    list.appendChild(div);
  });
}

function saveNote() {
  const text = document.getElementById('note-field').value.trim();
  if(!text) { toast('La note ne peut pas être vide'); return; }
  notes.unshift({
    id: Date.now(),
    workId: currentWorkId,
    type: currentType,
    quote: document.getElementById('quote-field').value.trim(),
    text,
    page: document.getElementById('page-field').value.trim(),
    date: Date.now()
  });
  save();
  document.getElementById('note-field').value='';
  document.getElementById('quote-field').value='';
  document.getElementById('page-field').value='';
  renderNotes(); renderWorks();
  toast('Note sauvegardée');
}

function deleteNote(id) {
  if(!confirm('Supprimer cette note ?')) return;
  notes = notes.filter(n=>n.id!==id);
  save(); renderNotes(); renderWorks(); renderFiche(); renderStats();
}

// ── FICHE ──
function renderFiche() {
  const div = document.getElementById('fiche-content');
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;

  if(!scope.length) {
    div.innerHTML = `<div class="empty-state"><div class="empty-text">Ajoutez des notes pour générer la fiche automatiquement.</div></div>`;
    return;
  }

  const by = t => scope.filter(n=>n.type===t);
  let html = '';

  if(w) html += `<div class="fiche-title">${escHtml(w.title)}</div><div class="fiche-author">${escHtml(w.author)}${w.year?` · ${w.year}`:''}${w.cat?` · ${w.cat}`:''}</div>`;

  if(by('summary').length) {
    html += `<div class="fiche-section"><div class="fiche-label">Résumés</div>` +
      by('summary').map(n=>`<div class="fiche-item"><span class="fiche-bullet">≡</span><span>${escHtml(n.text)}${n.page?` <span style="font-size:11px;color:var(--ink3)">(p.${n.page})</span>`:''}</span></div>`).join('') + '</div>';
  }
  if(by('insight').length) {
    html += `<div class="fiche-section"><div class="fiche-label">Idées clés</div>` +
      by('insight').map(n=>`<div class="fiche-item"><span class="fiche-bullet">◆</span><span>${escHtml(n.text)}</span></div>`).join('') + '</div>';
  }
  if(by('highlight').length) {
    html += `<div class="fiche-section"><div class="fiche-label">Citations surlignées</div>` +
      by('highlight').map(n=>`${n.quote?`<div class="fiche-quote">"${escHtml(n.quote)}"</div>`:''}${n.text?`<div class="fiche-item" style="margin-top:-4px"><span class="fiche-bullet" style="font-size:10px">→</span><span style="font-size:12px;color:var(--ink2)">${escHtml(n.text)}</span></div>`:''}`).join('') + '</div>';
  }
  if(by('lexicon').length) {
    html += `<div class="fiche-section"><div class="fiche-label">Lexique</div>` +
      by('lexicon').map(n=>`<div class="fiche-item"><span class="fiche-bullet">α</span><span><strong>${escHtml(n.quote||'')}</strong>${n.text?` — ${escHtml(n.text)}`:''}</span></div>`).join('') + '</div>';
  }
  if(by('question').length) {
    html += `<div class="fiche-section"><div class="fiche-label">Questions ouvertes</div>` +
      by('question').map(n=>`<div class="fiche-item"><span class="fiche-bullet">◌</span><span>${escHtml(n.text)}</span></div>`).join('') + '</div>';
  }

  div.innerHTML = html;
}

// ── STATS ──
function renderStats() {
  const div = document.getElementById('stats-content');
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  const byType = t => scope.filter(n=>n.type===t).length;
  const total = scope.length;

  const bars = [
    ['Surlignages', byType('highlight'), '#B8892A'],
    ['Idées clés', byType('insight'), '#2B5278'],
    ['Questions', byType('question'), '#8B3325'],
    ['Résumés', byType('summary'), '#2D6640'],
    ['Lexique', byType('lexicon'), '#6B4F2A'],
  ];

  let html = `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">notes au total</div></div>
      <div class="stat-box"><div class="stat-num">${byType('insight')}</div><div class="stat-lbl">idées clés</div></div>
      <div class="stat-box"><div class="stat-num">${byType('question')}</div><div class="stat-lbl">questions</div></div>
      <div class="stat-box"><div class="stat-num">${byType('lexicon')}</div><div class="stat-lbl">mots de lexique</div></div>
    </div>`;

  if(w) {
    const pct = w.pages ? Math.min(100, Math.round((w.read||0)/w.pages*100)) : 0;
    html += `
      <div class="progress-section">
        <div class="prog-title">
          <span>${escHtml(w.title)}</span>
          <span style="font-size:12px;color:var(--ink3)">${pct}% lu</span>
        </div>
        <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--ink3)">p. ${w.read||0} / ${w.pages||'?'}</div>
        <div class="prog-update">
          <span style="font-size:12px;color:var(--ink3)">Page actuelle :</span>
          <input class="prog-input" id="prog-inp" type="number" value="${w.read||0}" min="0" max="${w.pages||9999}">
          <button class="btn-prog" onclick="updateProgress()">Mettre à jour</button>
        </div>
      </div>`;
  }

  html += `<div class="bar-chart-section">
    <div style="font-size:11px;color:var(--ink3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.8px">Répartition</div>`;
  bars.forEach(([label, count, color]) => {
    const pct = total ? Math.round(count/total*100) : 0;
    html += `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += '</div>';

  div.innerHTML = html;
}

function updateProgress() {
  const w = works.find(w=>w.id===currentWorkId);
  if(!w) return;
  const val = parseInt(document.getElementById('prog-inp')?.value)||0;
  w.read = Math.min(val, w.pages||999999);
  save(); renderStats(); renderWorks();
  toast('Progression mise à jour');
}

// ── AI ──
async function aiAction(action) {
  const key = apiKey || localStorage.getItem('lectarium_api_key') || '';
  if(!key) { toast('Entrez d\'abord votre clé API Anthropic'); return; }

  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  if(!scope.length) { toast('Aucune note à analyser'); return; }

  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  const thinking = document.getElementById('ai-thinking');
  const result = document.getElementById('ai-result');
  thinking.style.display = 'block';
  result.innerHTML = '';

  const notesText = scope.map(n => `[${TYPE_LABELS[n.type]||n.type}${n.page?' p.'+n.page:''}]\n${n.quote?'Citation: "'+n.quote+'"\n':''}${n.text}`).join('\n\n');
  const ctx = w ? `Œuvre : "${w.title}" de ${w.author}${w.year?' ('+w.year+')':''}${w.cat?' · '+w.cat:''}.\n\n` : 'Notes issues de ma bibliothèque de lecture.\n\n';

  const prompts = {
    résumé: `${ctx}Mes notes de lecture :\n\n${notesText}\n\nFais un résumé synthétique et structuré en 150-200 mots, en français. Style académique et fluide.`,
    thèmes: `${ctx}Mes notes de lecture :\n\n${notesText}\n\nDégage 3 à 5 grands thèmes ou axes conceptuels. Pour chaque thème : un titre court, une phrase d'explication. Style structuré.`,
    questions: `${ctx}Mes notes, dont ces questions ouvertes :\n${scope.filter(n=>n.type==='question').map(n=>n.text).join('\n')}\n\nApprofondis ces questions et propose des pistes de réflexion ou de recherche complémentaire. Style philosophique et académique.`,
    fiche: `${ctx}Mes notes de lecture :\n\n${notesText}\n\nGénère une fiche de lecture structurée avec : 1) Thèse ou propos central, 2) Concepts clés mobilisés, 3) Arguments principaux, 4) Limites ou questions soulevées. Max 300 mots.`,
    critique: `${ctx}Mes notes de lecture :\n\n${notesText}\n\nPropose une analyse critique : points forts de l'œuvre, limites ou angles morts, mises en perspective avec d'autres auteurs ou courants. Style académique, environ 250 mots.`,
    lexique: `${ctx}Voici les termes de mon lexique :\n${scope.filter(n=>n.type==='lexicon').map(n=>`${n.quote||n.text}`).join(', ')}\n\nPour chaque terme, enrichis ou complète la définition dans le contexte de l'œuvre. Sois précis et concis.`,
  };

  const titles = { résumé:'Résumé synthétique', thèmes:'Thèmes dégagés', questions:'Approfondissement', fiche:'Fiche de lecture', critique:'Analyse critique', lexique:'Lexique enrichi' };

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1200,
        messages: [{ role: 'user', content: prompts[action] }]
      })
    });

    if(!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `Erreur ${res.status}`);
    }

    const data = await res.json();
    const text = data.content?.map(c=>c.text||'').join('') || 'Pas de réponse.';
    result.innerHTML = `
      <div class="ai-result-title">${titles[action]||action}</div>
      <div class="ai-result-body">${formatAI(text)}</div>`;
  } catch(e) {
    result.innerHTML = `<div class="ai-result-body" style="color:var(--red)">Erreur : ${escHtml(e.message)}<br><br>Vérifiez votre clé API et votre connexion.</div>`;
  }
  thinking.style.display = 'none';
}

function formatAI(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')
    .replace(/^(.)/,'<p>$1').concat('</p>');
}

// ── EXPORT ──
function exportNotes() {
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  let md = w ? `# ${w.title}\n*${w.author}${w.year?' ('+w.year+')':''}*\n\n` : '# Notes de lecture\n\n';

  const byType = t => scope.filter(n=>n.type===t);
  const sections = [
    ['Résumés', byType('summary')],
    ['Idées clés', byType('insight')],
    ['Citations surlignées', byType('highlight')],
    ['Lexique', byType('lexicon')],
    ['Questions ouvertes', byType('question')],
  ];

  sections.forEach(([title, items]) => {
    if(!items.length) return;
    md += `## ${title}\n\n`;
    items.forEach(n => {
      if(n.quote) md += `> "${n.quote}"\n\n`;
      md += `${n.text}${n.page?' *(p.'+n.page+')*':''}\n\n`;
    });
  });

  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lectarium-${(w?w.title:'notes').replace(/[^a-z0-9]/gi,'-').toLowerCase()}.md`;
  a.click();
  toast('Fiche exportée en Markdown');
}

// ── UTILS ──
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, dur=2400) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove('show'), dur);
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key==='Enter') saveNote();
  if(e.key==='Escape') closeModal();
});

// ── INIT ──
load();
renderWorks();
renderNotes();
</script>
