<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lectarium">
<meta name="theme-color" content="#F7F5F0">
<title>Lectarium</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #F7F5F0;
  --bg2: #EFECE5;
  --bg3: #E5E1D8;
  --paper: #FDFCFA;
  --ink: #1C1A17;
  --ink2: #4A4740;
  --ink3: #8A8780;
  --border: rgba(60,55,45,0.13);
  --border2: rgba(60,55,45,0.24);
  --accent: #6B4F2A;
  --accent-bg: #F5EDE0;
  --gold: #B8892A;
  --gold-bg: #FDF6E8;
  --blue: #2B5278;
  --blue-bg: #EAF0F8;
  --green: #2D6640;
  --green-bg: #E8F2EB;
  --red: #8B3325;
  --red-bg: #F5E8E6;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --serif: 'Source Serif 4', Georgia, serif;
  --display: 'Playfair Display', Georgia, serif;
}

[data-theme="dark"] {
  --bg: #141210;
  --bg2: #1C1A16;
  --bg3: #242018;
  --paper: #1E1C18;
  --ink: #F0EDE6;
  --ink2: #B8B4AA;
  --ink3: #6A6760;
  --border: rgba(255,245,220,0.10);
  --border2: rgba(255,245,220,0.20);
  --accent: #C8926A;
  --accent-bg: #2A2018;
  --gold: #D4A855;
  --gold-bg: #241E10;
  --blue: #7AABDA;
  --blue-bg: #101C28;
  --green: #6DBF85;
  --green-bg: #101A12;
  --red: #D47A6A;
  --red-bg: #221410;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
}

/* ── APP SHELL ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  padding: calc(var(--safe-top) + 10px) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.topbar-brand {
  flex: 1;
}

.brand-name {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.4px;
  line-height: 1;
}

.brand-sub {
  font-size: 10px;
  color: var(--ink3);
  font-style: italic;
  margin-top: 1px;
}

.btn-round {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
}
.btn-round:active { background: var(--bg3); }

/* ── SCREENS ── */
.screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px;
}

.scroll-area::-webkit-scrollbar { display: none; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex;
  padding: 8px 0 calc(var(--safe-bottom) + 4px);
  background: var(--bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px;
  cursor: pointer;
  border: none;
  background: none;
  transition: opacity 0.15s;
}

.nav-tab:active { opacity: 0.6; }

.nav-tab-icon {
  font-size: 20px;
  line-height: 1;
  color: var(--ink3);
  transition: color 0.15s;
}

.nav-tab-label {
  font-size: 9.5px;
  color: var(--ink3);
  font-family: var(--serif);
  letter-spacing: 0.2px;
  transition: color 0.15s;
}

.nav-tab.active .nav-tab-icon,
.nav-tab.active .nav-tab-label {
  color: var(--accent);
}

/* ── NOTES SCREEN ── */
.notes-filter {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.notes-filter::-webkit-scrollbar { display: none; }

.filter-chip {
  padding: 6px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 12px;
  font-family: var(--serif);
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s;
}

.filter-chip.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* ── NOTE CARD ── */
.note-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
}

.note-card.highlight { border-left: 3px solid var(--gold); }
.note-card.insight   { border-left: 3px solid var(--blue); }
.note-card.question  { border-left: 3px solid var(--red); }
.note-card.summary   { border-left: 3px solid var(--green); }
.note-card.lexicon   { border-left: 3px solid var(--accent); }

.note-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.type-pill {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 10px;
  font-family: var(--serif);
}

.pill-highlight { background: var(--gold-bg); color: var(--gold); }
.pill-insight   { background: var(--blue-bg); color: var(--blue); }
.pill-question  { background: var(--red-bg); color: var(--red); }
.pill-summary   { background: var(--green-bg); color: var(--green); }
.pill-lexicon   { background: var(--accent-bg); color: var(--accent); }

.page-badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--bg2);
  color: var(--ink3);
  border: 1px solid var(--border);
}

.work-tag {
  font-size: 10px;
  color: var(--ink3);
  font-style: italic;
  margin-left: auto;
  max-width: 120px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.note-quote {
  font-style: italic;
  color: var(--ink2);
  font-size: 13.5px;
  border-left: 2px solid var(--border2);
  padding: 4px 10px;
  margin-bottom: 8px;
  line-height: 1.6;
}

.note-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.7;
}

.note-swipe-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.btn-delete {
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid var(--red-bg);
  background: var(--red-bg);
  color: var(--red);
  font-size: 12px;
  font-family: var(--serif);
  cursor: pointer;
}

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 68px);
  right: 18px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  font-size: 26px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  z-index: 50;
  transition: transform 0.15s;
}

.fab:active { transform: scale(0.94); }

/* ── ADD NOTE SHEET ── */
.sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
}

.sheet-bg.open { display: flex; }

.sheet {
  width: 100%;
  background: var(--paper);
  border-radius: 20px 20px 0 0;
  padding: 0 0 calc(var(--safe-bottom) + 8px);
  max-height: 92dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 12px auto 16px;
}

.sheet-title {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  padding: 0 18px 14px;
  border-bottom: 1px solid var(--border);
}

.sheet-body { padding: 16px 18px; }

.type-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.type-card {
  padding: 10px 6px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg2);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}

.type-card.active {
  border-color: var(--ink);
  background: var(--paper);
}

.type-card-icon { font-size: 18px; display: block; margin-bottom: 3px; }
.type-card-label { font-size: 11px; color: var(--ink2); font-family: var(--serif); }
.type-card.active .type-card-label { color: var(--ink); font-weight: 500; }

.field-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink3);
  margin-bottom: 5px;
  display: block;
}

.field-input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg2);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  margin-bottom: 12px;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

.field-input:focus { outline: none; border-color: var(--border2); background: var(--paper); }
.field-input::placeholder { color: var(--ink3); font-style: italic; }

textarea.field-input {
  resize: none;
  min-height: 90px;
  line-height: 1.6;
}

.row-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-save-note {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: var(--ink);
  color: var(--bg);
  font-size: 16px;
  font-family: var(--serif);
  cursor: pointer;
  margin-top: 4px;
  transition: opacity 0.15s;
}

.btn-save-note:active { opacity: 0.8; }

/* ── BIBLIO SCREEN ── */
.work-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.work-card:active { background: var(--bg2); }
.work-card.selected { border-color: var(--accent); background: var(--accent-bg); }

.work-color-bar {
  width: 4px;
  height: 48px;
  border-radius: 2px;
  background: var(--accent);
  flex-shrink: 0;
}

.work-info { flex: 1; min-width: 0; }

.work-title-t {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  font-family: var(--serif);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.work-author-t {
  font-size: 12px;
  color: var(--ink3);
  font-style: italic;
  margin-top: 2px;
}

.work-prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.prog-bar {
  flex: 1;
  height: 3px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 0.4s;
}

.work-note-count {
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
}

.work-arrow {
  font-size: 16px;
  color: var(--ink3);
  flex-shrink: 0;
}

.btn-add-work {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1.5px dashed var(--border2);
  background: transparent;
  color: var(--ink3);
  font-size: 14px;
  font-family: var(--serif);
  cursor: pointer;
  margin-top: 4px;
  transition: all 0.15s;
}

.btn-add-work:active { background: var(--bg2); }

/* ── WORK DETAIL ── */
.back-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.btn-back {
  font-size: 24px;
  color: var(--accent);
  border: none;
  background: none;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}

.back-title {
  font-size: 15px;
  color: var(--ink);
  font-family: var(--serif);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── FICHE SCREEN ── */
.fiche-header {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}

.fiche-big-title {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  font-style: italic;
  line-height: 1.3;
  margin-bottom: 4px;
}

.fiche-big-author {
  font-size: 13px;
  color: var(--ink3);
  font-style: italic;
}

.fiche-section {
  margin-bottom: 16px;
}

.fiche-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink3);
  margin-bottom: 8px;
  padding-left: 2px;
}

.fiche-item {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.65;
}

.fiche-quote-item {
  font-style: italic;
  color: var(--ink2);
  border-left: 2px solid var(--accent);
  border-radius: 0 10px 10px 0;
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* ── AI SCREEN ── */
.ai-key-box {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}

.ai-key-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink3);
  margin-bottom: 8px;
  display: block;
}

.ai-key-row {
  display: flex;
  gap: 8px;
}

.ai-key-input {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg2);
  color: var(--ink);
  font-size: 13px;
  font-family: var(--serif);
  -webkit-appearance: none;
}

.ai-key-input:focus { outline: none; border-color: var(--border2); }

.btn-key-ok {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  font-family: var(--serif);
  cursor: pointer;
}

.ai-context-bar {
  background: var(--accent-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 12.5px;
  color: var(--accent);
  font-style: italic;
}

.ai-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.btn-ai {
  padding: 14px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  font-size: 13px;
  font-family: var(--serif);
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: all 0.15s;
}

.btn-ai:active { background: var(--bg2); }

.btn-ai-icon { font-size: 20px; }
.btn-ai-label { font-size: 12px; line-height: 1.3; }

.ai-result-box {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}

.ai-result-title {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.ai-result-text {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.75;
  font-family: var(--serif);
}

.ai-thinking {
  text-align: center;
  padding: 20px;
  color: var(--ink3);
  font-size: 13px;
  font-style: italic;
  display: none;
}

/* ── STATS SCREEN ── */
.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.stat-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
}

.stat-num {
  font-family: var(--display);
  font-size: 32px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}

.stat-lbl {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 5px;
}

.prog-section {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
}

.prog-header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 8px;
}

.prog-pct { color: var(--green); font-weight: 500; }

.prog-bar-big {
  height: 7px;
  background: var(--bg2);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
}

.prog-fill-big {
  height: 100%;
  background: var(--green);
  border-radius: 4px;
  transition: width 0.5s;
}

.prog-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink3);
}

.prog-num-input {
  width: 80px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg2);
  color: var(--ink);
  font-size: 14px;
  font-family: var(--serif);
  text-align: center;
  -webkit-appearance: none;
}

.prog-num-input:focus { outline: none; border-color: var(--border2); }

.btn-prog-ok {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  font-family: var(--serif);
  cursor: pointer;
}

.bars-section {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
}

.section-h {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink3);
  margin-bottom: 14px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 11px;
}

.bar-lbl { font-size: 12.5px; color: var(--ink2); width: 80px; flex-shrink: 0; }

.bar-track {
  flex: 1;
  height: 7px;
  background: var(--bg2);
  border-radius: 4px;
  overflow: hidden;
}

.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.bar-n { font-size: 12px; color: var(--ink3); width: 20px; text-align: right; }

/* ── MODAL ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
}
.modal-bg.open { display: flex; }

.modal-sheet {
  width: 100%;
  background: var(--paper);
  border-radius: 20px 20px 0 0;
  padding: 0 0 calc(var(--safe-bottom) + 8px);
  max-height: 88dvh;
  overflow-y: auto;
  animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
}

.modal-body { padding: 8px 18px 0; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 80px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-family: var(--serif);
  opacity: 0;
  transition: all 0.25s;
  z-index: 300;
  white-space: nowrap;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--ink3);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; font-style: italic; line-height: 1.7; }

/* ── SEARCH ── */
.search-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.search-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg2);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 14px;
  -webkit-appearance: none;
}

.search-input:focus { outline: none; border-color: var(--border2); background: var(--paper); }
.search-input::placeholder { color: var(--ink3); font-style: italic; }

</head>
<body>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="brand-name">Lectarium</div>
      <div class="brand-sub" id="ctx-label">toutes les notes</div>
    </div>
    <button class="btn-round" onclick="toggleTheme()">◑</button>
  </div>

  <!-- ═══ SCREEN: NOTES ═══ -->
  <div class="screen active" id="screen-notes">
    <div class="search-bar">
      <input class="search-input" id="search" placeholder="Chercher…" oninput="renderNotes()">
    </div>
    <div class="notes-filter" id="notes-filter">
      <button class="filter-chip active" onclick="setFilter('all',this)">Tout</button>
      <button class="filter-chip" onclick="setFilter('highlight',this)">◐ Surlignage</button>
      <button class="filter-chip" onclick="setFilter('insight',this)">◆ Idée clé</button>
      <button class="filter-chip" onclick="setFilter('question',this)">◌ Question</button>
      <button class="filter-chip" onclick="setFilter('summary',this)">≡ Résumé</button>
      <button class="filter-chip" onclick="setFilter('lexicon',this)">α Lexique</button>
    </div>
    <div class="scroll-area" id="notes-list"></div>
  </div>

  <!-- ═══ SCREEN: BIBLIO ═══ -->
  <div class="screen" id="screen-biblio">
    <div class="scroll-area" id="biblio-list"></div>
  </div>

  <!-- ═══ SCREEN: FICHE ═══ -->
  <div class="screen" id="screen-fiche">
    <div class="scroll-area" id="fiche-content"></div>
  </div>

  <!-- ═══ SCREEN: IA ═══ -->
  <div class="screen" id="screen-ia">
    <div class="scroll-area">
      <div class="ai-key-box">
        <label class="ai-key-label">Clé API Anthropic</label>
        <div class="ai-key-row">
          <input class="ai-key-input" id="api-key" type="password" placeholder="sk-ant-…">
          <button class="btn-key-ok" onclick="saveKey()">OK</button>
        </div>
      </div>
      <div class="ai-context-bar" id="ai-ctx-bar">Analyse : toutes mes notes</div>
      <div class="ai-btn-grid">
        <button class="btn-ai" onclick="aiDo('résumé')">
          <span class="btn-ai-icon">≡</span>
          <span class="btn-ai-label">Résumer mes notes</span>
        </button>
        <button class="btn-ai" onclick="aiDo('thèmes')">
          <span class="btn-ai-icon">◈</span>
          <span class="btn-ai-label">Dégager les thèmes</span>
        </button>
        <button class="btn-ai" onclick="aiDo('questions')">
          <span class="btn-ai-icon">◌</span>
          <span class="btn-ai-label">Approfondir questions</span>
        </button>
        <button class="btn-ai" onclick="aiDo('fiche')">
          <span class="btn-ai-icon">□</span>
          <span class="btn-ai-label">Fiche de lecture</span>
        </button>
        <button class="btn-ai" onclick="aiDo('critique')">
          <span class="btn-ai-icon">◆</span>
          <span class="btn-ai-label">Analyse critique</span>
        </button>
        <button class="btn-ai" onclick="aiDo('lexique')">
          <span class="btn-ai-icon">α</span>
          <span class="btn-ai-label">Enrichir le lexique</span>
        </button>
      </div>
      <div class="ai-thinking" id="ai-thinking">Réflexion en cours…</div>
      <div id="ai-result"></div>
    </div>
  </div>

  <!-- ═══ SCREEN: STATS ═══ -->
  <div class="screen" id="screen-stats">
    <div class="scroll-area" id="stats-content"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-tab active" id="nav-notes" onclick="setScreen('notes')">
      <span class="nav-tab-icon">📝</span>
      <span class="nav-tab-label">Notes</span>
    </button>
    <button class="nav-tab" id="nav-biblio" onclick="setScreen('biblio')">
      <span class="nav-tab-icon">📚</span>
      <span class="nav-tab-label">Biblio</span>
    </button>
    <button class="nav-tab" id="nav-fiche" onclick="setScreen('fiche')">
      <span class="nav-tab-icon">🗂</span>
      <span class="nav-tab-label">Fiche</span>
    </button>
    <button class="nav-tab" id="nav-ia" onclick="setScreen('ia')">
      <span class="nav-tab-icon">✦</span>
      <span class="nav-tab-label">IA</span>
    </button>
    <button class="nav-tab" id="nav-stats" onclick="setScreen('stats')">
      <span class="nav-tab-icon">📊</span>
      <span class="nav-tab-label">Stats</span>
    </button>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openSheet()">+</button>

<!-- ADD NOTE SHEET -->
<div class="sheet-bg" id="sheet-bg" onclick="handleSheetBg(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nouvelle note</div>
    <div class="sheet-body">
      <label class="field-label">Type</label>
      <div class="type-grid">
        <div class="type-card active" id="tc-highlight" onclick="setType('highlight')">
          <span class="type-card-icon">◐</span>
          <span class="type-card-label">Surlignage</span>
        </div>
        <div class="type-card" id="tc-insight" onclick="setType('insight')">
          <span class="type-card-icon">◆</span>
          <span class="type-card-label">Idée clé</span>
        </div>
        <div class="type-card" id="tc-question" onclick="setType('question')">
          <span class="type-card-icon">◌</span>
          <span class="type-card-label">Question</span>
        </div>
        <div class="type-card" id="tc-summary" onclick="setType('summary')">
          <span class="type-card-icon">≡</span>
          <span class="type-card-label">Résumé</span>
        </div>
        <div class="type-card" id="tc-lexicon" onclick="setType('lexicon')">
          <span class="type-card-icon">α</span>
          <span class="type-card-label">Lexique</span>
        </div>
      </div>

      <label class="field-label">Citation (optionnel)</label>
      <input class="field-input" id="s-quote" placeholder="Extrait exact du texte…" style="font-style:italic">

      <label class="field-label">Votre note *</label>
      <textarea class="field-input" id="s-note" placeholder="Réflexion, définition, analyse…"></textarea>

      <div class="row-fields">
        <div>
          <label class="field-label">Page</label>
          <input class="field-input" id="s-page" placeholder="ex: 42" type="number">
        </div>
        <div>
          <label class="field-label">Œuvre</label>
          <select class="field-input" id="s-work" style="padding:11px 10px">
            <option value="">Aucune</option>
          </select>
        </div>
      </div>

      <button class="btn-save-note" onclick="saveNote()">Sauvegarder →</button>
    </div>
  </div>
</div>

<!-- ADD WORK MODAL -->
<div class="modal-bg" id="modal-bg" onclick="handleModalBg(event)">
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" style="padding:0 18px 14px">Nouvelle œuvre</div>
    <div class="modal-body">
      <label class="field-label">Titre *</label>
      <input class="field-input" id="w-title" placeholder="Ex : Éloges du Dépassement">
      <label class="field-label">Auteur(s) *</label>
      <input class="field-input" id="w-author" placeholder="Ex : Pesquet, Klein">
      <label class="field-label">Catégorie</label>
      <input class="field-input" id="w-cat" placeholder="Essai, Roman, Philosophie…">
      <div class="row-fields">
        <div>
          <label class="field-label">Pages</label>
          <input class="field-input" id="w-pages" type="number" placeholder="280">
        </div>
        <div>
          <label class="field-label">Année</label>
          <input class="field-input" id="w-year" type="number" placeholder="2023">
        </div>
      </div>
      <button class="btn-save-note" onclick="addWork()" style="margin-bottom:8px">Ajouter →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let works=[], notes=[], currentWorkId=null, currentFilter='all', currentType='highlight', currentScreen='notes', apiKey='';

const TYPE_LABELS = { highlight:'Surlignage', insight:'Idée clé', question:'Question', summary:'Résumé', lexicon:'Lexique' };

// ── STORAGE ──
function save() {
  localStorage.setItem('lect_works', JSON.stringify(works));
  localStorage.setItem('lect_notes', JSON.stringify(notes));
}

function load() {
  try { works = JSON.parse(localStorage.getItem('lect_works')||'[]'); } catch(e){ works=[]; }
  try { notes = JSON.parse(localStorage.getItem('lect_notes')||'[]'); } catch(e){ notes=[]; }
  apiKey = localStorage.getItem('lect_key')||'';
  if(apiKey) document.getElementById('api-key').value = apiKey;
  const th = localStorage.getItem('lect_theme')||'light';
  if(th==='dark') document.documentElement.setAttribute('data-theme','dark');
}

// ── THEME ──
function toggleTheme() {
  const d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
  localStorage.setItem('lect_theme', d?'light':'dark');
}

// ── SCREEN ──
function setScreen(s) {
  currentScreen = s;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  document.getElementById('fab').style.display = s==='notes' ? 'flex' : 'none';
  if(s==='biblio') renderBiblio();
  if(s==='fiche') renderFiche();
  if(s==='stats') renderStats();
  updateCtx();
}

function updateCtx() {
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  const label = w ? w.title : 'toutes les notes';
  document.getElementById('ctx-label').textContent = label;
  document.getElementById('ai-ctx-bar').textContent = `Analyse : ${label}`;
}

// ── NOTES ──
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(el=>el.classList.remove('active'));
  btn.classList.add('active');
  renderNotes();
}

function renderNotes() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  let filtered = notes.filter(n => {
    if(currentWorkId && n.workId !== currentWorkId) return false;
    if(currentFilter !== 'all' && n.type !== currentFilter) return false;
    if(q && !(n.text||'').toLowerCase().includes(q) && !(n.quote||'').toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a,b)=>b.date-a.date);

  const list = document.getElementById('notes-list');
  if(!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><div class="empty-text">Aucune note ici.<br>Appuyez sur + pour commencer.</div></div>`;
    return;
  }
  list.innerHTML = '';
  filtered.forEach(n => {
    const w = works.find(w=>w.id===n.workId);
    const div = document.createElement('div');
    div.className = `note-card ${n.type}`;
    div.innerHTML = `
      <div class="note-header">
        <span class="type-pill pill-${n.type}">${TYPE_LABELS[n.type]||n.type}</span>
        ${n.page?`<span class="page-badge">p.&nbsp;${n.page}</span>`:''}
        ${w?`<span class="work-tag">${esc(w.title)}</span>`:''}
      </div>
      ${n.quote?`<div class="note-quote">"${esc(n.quote)}"</div>`:''}
      <div class="note-text">${esc(n.text)}</div>
      <div class="note-swipe-actions">
        <button class="btn-delete" onclick="delNote(${n.id})">Supprimer</button>
      </div>`;
    list.appendChild(div);
  });
}

function delNote(id) {
  if(!confirm('Supprimer cette note ?')) return;
  notes = notes.filter(n=>n.id!==id);
  save(); renderNotes(); renderBiblio();
}

// ── SHEET ──
function openSheet() {
  populateWorkSelect();
  document.getElementById('sheet-bg').classList.add('open');
  setTimeout(()=>document.getElementById('s-note').focus(), 350);
}

function closeSheet() {
  document.getElementById('sheet-bg').classList.remove('open');
}

function handleSheetBg(e) {
  if(e.target===document.getElementById('sheet-bg')) closeSheet();
}

function setType(t) {
  currentType = t;
  ['highlight','insight','question','summary','lexicon'].forEach(id=>{
    document.getElementById('tc-'+id)?.classList.remove('active');
  });
  document.getElementById('tc-'+t)?.classList.add('active');
}

function populateWorkSelect() {
  const sel = document.getElementById('s-work');
  sel.innerHTML = '<option value="">Aucune</option>';
  works.forEach(w=>{
    const o = document.createElement('option');
    o.value = w.id;
    o.textContent = w.title;
    if(w.id===currentWorkId) o.selected = true;
    sel.appendChild(o);
  });
}

function saveNote() {
  const text = document.getElementById('s-note').value.trim();
  if(!text) { toast('La note ne peut pas être vide'); return; }
  const wid = document.getElementById('s-work').value;
  notes.unshift({
    id: Date.now(),
    workId: wid ? parseInt(wid) : null,
    type: currentType,
    quote: document.getElementById('s-quote').value.trim(),
    text,
    page: document.getElementById('s-page').value.trim(),
    date: Date.now()
  });
  save();
  document.getElementById('s-note').value='';
  document.getElementById('s-quote').value='';
  document.getElementById('s-page').value='';
  closeSheet();
  renderNotes(); renderBiblio();
  toast('Note sauvegardée ✓');
}

// ── BIBLIO ──
function renderBiblio() {
  const list = document.getElementById('biblio-list');
  const colors = ['#B8892A','#2B5278','#2D6640','#8B3325','#6B4F2A'];
  list.innerHTML = '';

  if(works.length) {
    works.forEach((w,i) => {
      const cnt = notes.filter(n=>n.workId===w.id).length;
      const pct = w.pages ? Math.min(100,Math.round((w.read||0)/w.pages*100)) : 0;
      const div = document.createElement('div');
      div.className = 'work-card' + (currentWorkId===w.id?' selected':'');
      div.innerHTML = `
        <div class="work-color-bar" style="background:${colors[i%colors.length]}"></div>
        <div class="work-info">
          <div class="work-title-t">${esc(w.title)}</div>
          <div class="work-author-t">${esc(w.author)}${w.year?' · '+w.year:''}</div>
          <div class="work-prog-row">
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
            <span class="work-note-count">${cnt} note${cnt!==1?'s':''} · ${pct}%</span>
          </div>
        </div>
        <span class="work-arrow">${currentWorkId===w.id?'✓':'›'}</span>`;
      div.onclick = () => selectWork(w.id);
      list.appendChild(div);
    });
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-work';
  addBtn.innerHTML = '+ Ajouter une œuvre';
  addBtn.onclick = openModal;
  list.appendChild(addBtn);
}

function selectWork(id) {
  currentWorkId = (currentWorkId===id) ? null : id;
  renderBiblio(); renderNotes(); renderFiche(); renderStats(); updateCtx();
  if(currentWorkId) toast('Filtré sur : ' + works.find(w=>w.id===id)?.title);
  else toast('Affichage de toutes les notes');
}

// ── MODAL WORK ──
function openModal() {
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('w-title').focus(),300);
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

function handleModalBg(e) {
  if(e.target===document.getElementById('modal-bg')) closeModal();
}

function addWork() {
  const title = document.getElementById('w-title').value.trim();
  const author = document.getElementById('w-author').value.trim();
  if(!title||!author) { toast('Titre et auteur requis'); return; }
  const w = {
    id: Date.now(), title, author,
    cat: document.getElementById('w-cat').value.trim()||'Divers',
    pages: parseInt(document.getElementById('w-pages').value)||0,
    year: document.getElementById('w-year').value.trim(),
    read: 0
  };
  works.push(w);
  save();
  ['w-title','w-author','w-cat','w-pages','w-year'].forEach(id=>{ document.getElementById(id).value=''; });
  closeModal();
  currentWorkId = w.id;
  renderBiblio(); updateCtx();
  toast(`"${w.title}" ajouté`);
}

// ── FICHE ──
function renderFiche() {
  const div = document.getElementById('fiche-content');
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;

  if(!scope.length) {
    div.innerHTML = `<div class="empty"><div class="empty-text">Ajoutez des notes pour générer la fiche.</div></div>`;
    return;
  }

  const by = t => scope.filter(n=>n.type===t);
  let html = '';

  if(w) {
    html += `<div class="fiche-header">
      <div class="fiche-big-title">${esc(w.title)}</div>
      <div class="fiche-big-author">${esc(w.author)}${w.year?' · '+w.year:''}${w.cat?' · '+w.cat:''}</div>
    </div>`;
  }

  const sections = [
    ['Résumés', by('summary'), false],
    ['Idées clés', by('insight'), false],
    ['Citations surlignées', by('highlight'), true],
    ['Lexique', by('lexicon'), false],
    ['Questions ouvertes', by('question'), false],
  ];

  sections.forEach(([title, items, isQuote]) => {
    if(!items.length) return;
    html += `<div class="fiche-section"><div class="fiche-section-title">${title}</div>`;
    items.forEach(n => {
      if(isQuote && n.quote) {
        html += `<div class="fiche-item fiche-quote-item">"${esc(n.quote)}"</div>`;
        if(n.text) html += `<div class="fiche-item" style="margin-top:-4px;font-size:13px;color:var(--ink2)">→ ${esc(n.text)}</div>`;
      } else {
        html += `<div class="fiche-item">${n.type==='lexicon'&&n.quote?`<strong>${esc(n.quote)}</strong> — `:''} ${esc(n.text)}${n.page?` <span style="font-size:11px;color:var(--ink3)">(p.${n.page})</span>`:''}</div>`;
      }
    });
    html += '</div>';
  });

  div.innerHTML = html;
}

// ── STATS ──
function renderStats() {
  const div = document.getElementById('stats-content');
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  const by = t => scope.filter(n=>n.type===t).length;
  const total = scope.length;

  let html = `<div class="stat-row">
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">notes total</div></div>
    <div class="stat-card"><div class="stat-num">${by('insight')}</div><div class="stat-lbl">idées clés</div></div>
    <div class="stat-card"><div class="stat-num">${by('question')}</div><div class="stat-lbl">questions</div></div>
    <div class="stat-card"><div class="stat-num">${by('lexicon')}</div><div class="stat-lbl">lexique</div></div>
  </div>`;

  if(w) {
    const pct = w.pages ? Math.min(100,Math.round((w.read||0)/w.pages*100)) : 0;
    html += `<div class="prog-section">
      <div class="prog-header">
        <span>${esc(w.title)}</span>
        <span class="prog-pct">${pct}%</span>
      </div>
      <div class="prog-bar-big"><div class="prog-fill-big" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:12px">p. ${w.read||0} / ${w.pages||'?'}</div>
      <div class="prog-input-row">
        <span>Page actuelle :</span>
        <input class="prog-num-input" id="prog-inp" type="number" value="${w.read||0}" min="0" max="${w.pages||9999}">
        <button class="btn-prog-ok" onclick="updateProg()">OK</button>
      </div>
    </div>`;
  }

  html += `<div class="bars-section"><div class="section-h">Répartition des notes</div>`;
  [['Surlignages','highlight','#B8892A'],['Idées clés','insight','#2B5278'],['Questions','question','#8B3325'],['Résumés','summary','#2D6640'],['Lexique','lexicon','#6B4F2A']].forEach(([label,type,color])=>{
    const n = by(type);
    const pct = total ? Math.round(n/total*100) : 0;
    html += `<div class="bar-row">
      <div class="bar-lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-n">${n}</div>
    </div>`;
  });
  html += '</div>';

  div.innerHTML = html;
}

function updateProg() {
  const w = works.find(w=>w.id===currentWorkId);
  if(!w) return;
  w.read = Math.min(parseInt(document.getElementById('prog-inp')?.value)||0, w.pages||999999);
  save(); renderStats(); renderBiblio();
  toast('Progression mise à jour');
}

// ── AI ──
function saveKey() {
  apiKey = document.getElementById('api-key').value.trim();
  localStorage.setItem('lect_key', apiKey);
  toast('Clé API sauvegardée');
}

async function aiDo(action) {
  const key = apiKey || localStorage.getItem('lect_key') || '';
  if(!key) { toast('Entrez d\'abord votre clé API'); return; }
  const scope = currentWorkId ? notes.filter(n=>n.workId===currentWorkId) : notes;
  if(!scope.length) { toast('Aucune note à analyser'); return; }

  const w = currentWorkId ? works.find(w=>w.id===currentWorkId) : null;
  document.getElementById('ai-thinking').style.display = 'block';
  document.getElementById('ai-result').innerHTML = '';

  const notesText = scope.map(n=>`[${TYPE_LABELS[n.type]||n.type}${n.page?' p.'+n.page:''}]\n${n.quote?'"'+n.quote+'"\n':''}${n.text}`).join('\n\n');
  const ctx = w ? `Œuvre : "${w.title}" de ${w.author}${w.year?' ('+w.year+')':''}.\n\n` : '';

  const prompts = {
    résumé: `${ctx}Notes de lecture :\n\n${notesText}\n\nFais un résumé synthétique en 150-200 mots, en français. Style académique.`,
    thèmes: `${ctx}Notes de lecture :\n\n${notesText}\n\nDégage 3 à 5 grands thèmes conceptuels. Pour chaque thème : titre + explication.`,
    questions: `${ctx}Questions ouvertes :\n${scope.filter(n=>n.type==='question').map(n=>n.text).join('\n')}\n\nApprofondis ces questions avec des pistes de réflexion.`,
    fiche: `${ctx}Notes de lecture :\n\n${notesText}\n\nGénère une fiche structurée : 1) Thèse centrale 2) Concepts clés 3) Arguments 4) Limites. Max 300 mots.`,
    critique: `${ctx}Notes de lecture :\n\n${notesText}\n\nAnalyse critique : points forts, limites, mises en perspective. ~250 mots.`,
    lexique: `${ctx}Termes du lexique :\n${scope.filter(n=>n.type==='lexicon').map(n=>n.quote||n.text).join(', ')}\n\nEnrichis chaque définition dans le contexte de l'œuvre.`,
  };

  const titles = { résumé:'Résumé', thèmes:'Thèmes dégagés', questions:'Approfondissement', fiche:'Fiche de lecture', critique:'Analyse critique', lexique:'Lexique enrichi' };

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1000,
        messages: [{ role:'user', content: prompts[action] }]
      })
    });
    if(!res.ok) { const e=await res.json(); throw new Error(e.error?.message||'Erreur'); }
    const data = await res.json();
    const text = data.content?.map(c=>c.text||'').join('')||'Pas de réponse.';
    document.getElementById('ai-result').innerHTML = `
      <div class="ai-result-box">
        <div class="ai-result-title">${titles[action]}</div>
        <div class="ai-result-text">${fmtAI(text)}</div>
      </div>`;
  } catch(e) {
    document.getElementById('ai-result').innerHTML = `<div class="ai-result-box"><div class="ai-result-text" style="color:var(--red)">Erreur : ${esc(e.message)}</div></div>`;
  }
  document.getElementById('ai-thinking').style.display = 'none';
}

// ── UTILS ──
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtAI(text) {
  return esc(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>').replace(/^/,'<p>').concat('</p>');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── INIT ──
load();
renderNotes();
</script>
